<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Bungee&family=Creepster&family=VT323&display=swap">
<style>body{margin:0;background:#000}</style></head><body><canvas id="c" width="1080" height="1920"></canvas>
<script>
const cv = document.getElementById('c'), g = cv.getContext('2d');
function band(sub) { g.setTransform(2, 0, 0, 2, 0, 0); g.textAlign = 'center'; g.textBaseline = 'alphabetic'; g.font = '40px Creepster'; g.lineWidth = 6; g.strokeStyle = '#000'; g.strokeText('FITA MALDITA', 226, 152); g.fillStyle = '#ff2a3d'; g.fillText('FITA MALDITA', 226, 152); g.font = '26px VT323'; g.fillStyle = '#e9e4ef'; g.textAlign = 'left'; g.fillText(sub, 348, 150); }
function caption(parts) { g.setTransform(2, 0, 0, 2, 0, 0); g.font = '27px Bungee'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.lineJoin = 'round'; parts.forEach((p, i) => { const hot = p.startsWith('*'), t = p.replace(/\*/g, ''); g.lineWidth = 7; g.strokeStyle = '#000'; g.strokeText(t, 262, 742 + i * 32); g.fillStyle = hot ? '#ff2a3d' : '#fff'; g.fillText(t, 262, 742 + i * 32); }); }
function clip() { g.setTransform(2, 0, 0, 2, 0, 0); g.beginPath(); g.rect(0, 160, 540, 550); g.clip(); }
// boneco de palito: traço branco com leve tremor de mão
function wob(x, y, s) { return [x + Math.sin(y * .13 + s) * .8, y + Math.cos(x * .11 + s) * .8]; }
function line(pts, w = 4, col = '#f2f2f2', seed = 1) { g.strokeStyle = col; g.lineWidth = w; g.lineCap = 'round'; g.lineJoin = 'round'; g.beginPath(); pts.forEach((p, i) => { const q = wob(p[0], p[1], seed + i); i ? g.lineTo(q[0], q[1]) : g.moveTo(q[0], q[1]); }); g.stroke(); }
function stick(x, y, s, o = {}) {   // y = pés
  const hy = y - 150 * s, col = o.col || '#f2f2f2';
  g.lineWidth = 4; g.strokeStyle = col; g.beginPath(); g.arc(x, hy - 22 * s, 22 * s, 0, 7); g.stroke();
  line([[x, hy], [x, y - 60 * s]], 4, col); line([[x, y - 60 * s], [x - 22 * s, y]], 4, col); line([[x, y - 60 * s], [x + 22 * s, y]], 4, col);
  line([[x - (o.longArms ? 30 : 28) * s, hy + (o.longArms ? 110 : 55) * s], [x, hy + 18 * s], [x + (o.longArms ? 30 : 28) * s, hy + (o.longArms ? 110 : 55) * s]], 4, col);
  if (o.smile) { g.strokeStyle = col; g.lineWidth = 3; g.beginPath(); g.arc(x, hy - 22 * s, 14 * s, .3, Math.PI - .3); g.stroke(); }
  if (o.eyes) { g.fillStyle = o.eyes; g.fillRect(x - 9 * s, hy - 28 * s, 5 * s, 3 * s); g.fillRect(x + 4 * s, hy - 28 * s, 5 * s, 3 * s); }
}
function framePalito(n) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, 1080, 1920); g.save(); clip();
  g.fillStyle = '#0b0b0d'; g.fillRect(0, 160, 540, 550);
  if (n === 0) {   // a mãe na cama... e a mãe no corredor
    line([[40, 640], [500, 640]], 3, '#6a6a70');                         // chão
    line([[60, 470], [60, 640]], 3, '#6a6a70'); line([[60, 470], [230, 470], [230, 640]], 3, '#6a6a70');   // porta do quarto
    line([[80, 600], [210, 600], [210, 560], [80, 560], [80, 600]], 3, '#9a9aa0'); g.lineWidth = 4; g.strokeStyle = '#f2f2f2'; g.beginPath(); g.arc(105, 545, 14, 0, 7); g.stroke(); line([[118, 552], [200, 556]], 4);   // mãe deitada
    g.fillStyle = 'rgba(255,240,200,.08)'; g.fillRect(260, 330, 220, 310); line([[260, 330], [480, 330], [480, 640]], 3, '#6a6a70'); line([[260, 330], [260, 640]], 3, '#6a6a70');   // corredor
    stick(370, 640, 1.15, { smile: true, eyes: '#fff' });
    g.font = '22px VT323'; g.fillStyle = '#ff2a3d'; g.textAlign = 'center'; g.fillText('?', 145, 505); g.fillText('?', 370, 300);
  } else {   // qual é a verdadeira?
    line([[40, 640], [500, 640]], 3, '#6a6a70');
    stick(160, 640, 1.2, {}); stick(380, 640, 1.2, { longArms: true });
    g.font = '30px Bungee'; g.textAlign = 'center'; g.fillStyle = '#fff'; g.fillText('A', 160, 290); g.fillText('B', 380, 290);
    g.font = '22px VT323'; g.fillStyle = '#9a9aa0'; g.fillText('"FILHO, VEM DORMIR."', 160, 665); g.fillText('"FILHO, VEM DORMIR."', 380, 665);
  }
  g.restore(); band('ESTILO PALITO'); caption(n === 0 ? ['SUA MÃE ESTÁ NA CAMA.', '*E NO CORREDOR.*'] : ['QUAL É A VERDADEIRA?', '*COMENTA A OU B.*']);
  return cv.toDataURL('image/png');
}
// primeira pessoa + notificações chegando no celular
function rr(x, y, w, h, r) { g.beginPath(); g.roundRect(x, y, w, h, r); }
function notif(y, app, title, body, red) {
  g.fillStyle = 'rgba(245,245,250,.93)'; rr(70, y, 400, 92, 22); g.fill();
  g.fillStyle = red ? '#e5484d' : '#3a3f4b'; rr(86, y + 16, 26, 26, 7); g.fill(); g.fillStyle = '#fff'; g.font = '600 14px Inter'; g.textAlign = 'center'; g.fillText(red ? '!' : '?', 99, y + 34);
  g.textAlign = 'left'; g.fillStyle = '#6b6f7a'; g.font = '500 13px Inter'; g.fillText(app, 122, y + 34); g.textAlign = 'right'; g.fillText('agora', 452, y + 34);
  g.textAlign = 'left'; g.fillStyle = '#111'; g.font = '700 15px Inter'; g.fillText(title, 86, y + 60); g.font = '400 14px Inter'; g.fillStyle = '#222'; g.fillText(body, 86, y + 80);
}
function frameNotif(n) {
  g.setTransform(1, 0, 0, 1, 0, 0); g.fillStyle = '#000'; g.fillRect(0, 0, 1080, 1920); g.save(); clip();
  // cena: dentro do carro à noite, estrada vazia, loja de conveniência ao fundo
  const sky = g.createLinearGradient(0, 160, 0, 420); sky.addColorStop(0, '#05070d'); sky.addColorStop(1, '#141a2a'); g.fillStyle = sky; g.fillRect(0, 160, 540, 260);
  g.fillStyle = '#0d0f14'; g.fillRect(0, 420, 540, 290);
  g.fillStyle = '#20242e'; g.beginPath(); g.moveTo(230, 420); g.lineTo(310, 420); g.lineTo(560, 710); g.lineTo(-20, 710); g.fill();
  { const k = n === 1 ? 1.5 : 1; g.save(); g.translate(120, 470); g.scale(k, k); g.fillStyle = 'rgba(255,240,200,.85)'; g.fillRect(-60, -40, 120, 70); g.fillStyle = '#e5484d'; g.fillRect(-60, -50, 120, 12); g.fillStyle = '#0a0a0a'; g.fillRect(-20, -20, 30, 50); if (n === 1) { g.fillStyle = '#000'; g.beginPath(); g.ellipse(-5, -8, 8, 10, 0, 0, 7); g.fill(); g.fillRect(-13, 0, 16, 30); g.fillRect(3, -6, 14, 4); g.fillStyle = '#eaffea'; g.fillRect(-8, -11, 3, 2); g.fillRect(-1, -11, 3, 2); } g.restore(); g.fillStyle = 'rgba(255,240,200,.08)'; g.beginPath(); g.ellipse(120, 520, 140, 30, 0, 0, 7); g.fill(); }
  // painel e volante
  g.fillStyle = '#060608'; g.fillRect(0, 560, 540, 150); g.lineWidth = 22; g.strokeStyle = '#101012'; g.beginPath(); g.arc(150, 760, 170, Math.PI * 1.12, Math.PI * 1.88); g.stroke();
  const glow = g.createRadialGradient(270, 330, 10, 270, 330, 280); glow.addColorStop(0, 'rgba(200,215,255,.12)'); glow.addColorStop(1, 'rgba(0,0,0,0)'); g.fillStyle = glow; g.fillRect(0, 160, 540, 550);
  notif(190, 'Número desconhecido', 'REGRA 1.', 'Não entre na loja de conveniência.', true);
  if (n === 1) notif(295, 'Número desconhecido', 'REGRA 2.', 'Se alguém lá dentro acenar… acelere.', true);
  g.restore(); band('ESTILO NOTIFICAÇÃO'); caption(n === 0 ? ['3H17. POSTO VAZIO.', '*E A PRIMEIRA REGRA.*'] : ['TINHA ALGUÉM', '*ACENANDO.*']);
  return cv.toDataURL('image/png');
}
window.render = (k, n) => k === 'palito' ? framePalito(n) : frameNotif(n);
Promise.all(['40px Creepster', '26px VT323', '27px Bungee', '600 14px Inter', '700 15px Inter'].map(f => document.fonts.load(f))).then(() => { window.ready = true; });
</script></body></html>
